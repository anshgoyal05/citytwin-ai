<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230071E3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='16' height='16' x='4' y='4' rx='2'/ font-mono/><rect width='6' height='6' x='9' y='9' rx='1'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CityTwin AI - Next-Gen AI-Powered Smart City Digital Twin Platform for urban planning, real-time spatial simulation, autonomous agents, and city analytics." />
    <title>CityTwin AI - Spatial Decision Intelligence</title>
    <script>
      (function() {
        // Clear any old recon_theme dark setting to enforce Light Mode default
        try {
          if (localStorage.getItem('recon_theme') === 'dark') {
            localStorage.removeItem('recon_theme');
          }
          const theme = localStorage.getItem('citytwin_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('citytwin_theme', 'light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#0071E3] selection:text-white bg-[#FBFBFD] text-[#1D1D1F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
